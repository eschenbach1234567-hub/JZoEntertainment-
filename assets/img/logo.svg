<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="JZo Entertainment">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#d9d9d6"/>
      <stop offset="42%" stop-color="#8c8c88"/>
      <stop offset="58%" stop-color="#6d6d69"/>
      <stop offset="74%" stop-color="#c7c7c3"/>
      <stop offset="100%" stop-color="#f7f7f4"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffb35c" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#ffd39b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff4e4" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff8ef" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffcf8f" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#ff8a2e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8a2e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="entGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e7c9a3"/>
      <stop offset="50%" stop-color="#ffd9a8"/>
      <stop offset="100%" stop-color="#e7c9a3"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- surrounding arc / swoosh -->
  <path d="M 60 150 A 220 95 0 1 1 460 130" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 90 168 A 195 78 0 0 1 430 74" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- lens flare glow where the arc meets the wordmark -->
  <g filter="url(#softGlow)">
    <circle cx="452" cy="86" r="16" fill="url(#flare)"/>
  </g>
  <g stroke="#fff4e4" stroke-width="1.4" opacity="0.85">
    <line x1="452" y1="66" x2="452" y2="106"/>
    <line x1="432" y1="86" x2="472" y2="86"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="140" text-anchor="middle" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="104" fill="url(#metal)" letter-spacing="1">
    JZ<tspan font-size="76" dy="4">o</tspan>
  </text>
  <text x="280" y="140" text-anchor="middle" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="104" fill="url(#shine)" letter-spacing="1" opacity="0.8">
    JZ<tspan font-size="76" dy="4">o</tspan>
  </text>

  <!-- tagline -->
  <line x1="150" y1="182" x2="205" y2="182" stroke="url(#entGrad)" stroke-width="1.4" opacity="0.8"/>
  <text x="280" y="188" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="24" letter-spacing="8" fill="url(#entGrad)">ENTERTAINMENT</text>
  <line x1="355" y1="182" x2="410" y2="182" stroke="url(#entGrad)" stroke-width="1.4" opacity="0.8"/>
</svg>
