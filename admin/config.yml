backend:
  name: git-gateway
  branch: main

# Bilder werden hier hochgeladen/abgelegt:
media_folder: "assets/img"
public_folder: "/assets/img"

site_url: https://eschenbach1234567-hub.github.io/JZoEntertainment-/
logo_url: /assets/img/logo-transparent.png
locale: "de"

collections:

  - name: "prices"
    label: "Preise"
    label_singular: "Preise"
    files:
      - file: "data/prices.json"
        label: "Preisübersicht (Dienstleistungen-Seite)"
        name: "prices"
        fields:
          - label: "Stundensatz Foto/Video"
            name: "hourly"
            widget: "object"
            fields:
              - { label: "Betrag (z. B. 75 € / Stunde)", name: "amount", widget: "string" }
              - { label: "Zusatz-Hinweis", name: "note", widget: "string" }
          - label: "VHS-Kassette digitalisieren"
            name: "vhs"
            widget: "object"
            fields:
              - { label: "Betrag (z. B. 10–15 €)", name: "amount", widget: "string" }
              - { label: "Zusatz-Hinweis", name: "note", widget: "string" }
          - label: "Digital8-Kassette digitalisieren"
            name: "digital8"
            widget: "object"
            fields:
              - { label: "Betrag (z. B. 10–15 €)", name: "amount", widget: "string" }
              - { label: "Zusatz-Hinweis", name: "note", widget: "string" }
          - label: "Videoschnitt / Drohne / Contentberatung"
            name: "other"
            widget: "object"
            fields:
              - { label: "Betrag (z. B. auf Anfrage)", name: "amount", widget: "string" }
              - { label: "Zusatz-Hinweis", name: "note", widget: "string" }

  - name: "contact"
    label: "Kontaktdaten"
    label_singular: "Kontaktdaten"
    files:
      - file: "data/contact.json"
        label: "Kontakt (Header, Footer, Kontaktseite)"
        name: "contact"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Adresse", name: "addressLine", widget: "string" }
          - { label: "Telefonnummer (sichtbarer Text)", name: "phoneDisplay", widget: "string" }
          - { label: "Telefonnummer für Anruf-Link (Format +49...)", name: "phoneHref", widget: "string", hint: "Ohne Leerzeichen, mit +49 statt der 0 am Anfang." }
          - { label: "E-Mail-Adresse", name: "email", widget: "string" }
          - { label: "Instagram-Link", name: "instagramUrl", widget: "string" }
          - { label: "YouTube-Link", name: "youtubeUrl", widget: "string" }
          - { label: "Instagram-Anzeigename (z. B. @JZoEntertainment)", name: "instagramHandle", widget: "string" }

  - name: "services"
    label: "Dienstleistungen"
    label_singular: "Dienstleistung"
    files:
      - file: "data/services.json"
        label: "Dienstleistungen (Home & Dienstleistungen-Seite)"
        name: "services"
        fields:
          - { label: "Überschrift-Kürzel (z. B. \"Dienstleistungen\")", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Überschrift-Kürzel Preisbereich", name: "pricesEyebrow", widget: "string" }
          - { label: "Überschrift Preisbereich", name: "pricesHeading", widget: "string" }
          - { label: "Einleitungstext Preisbereich", name: "pricesIntro", widget: "text" }
          - { label: "Überschrift Angebots-Box (unten)", name: "ctaHeading", widget: "string" }
          - { label: "Text Angebots-Box (unten)", name: "ctaText", widget: "text" }
          - label: "Leistungen"
            name: "services"
            widget: "list"
            label_singular: "Leistung"
            summary: "{{title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - label: "Symbol"
                name: "icon"
                widget: "select"
                hint: "Passendes Symbol für die Karte auswählen."
                options:
                  - { label: "Kamera (Foto/Video)", value: "kamera" }
                  - { label: "Videoschnitt", value: "videoschnitt" }
                  - { label: "Drohne", value: "drohne" }
                  - { label: "Digitalisierung (Kassette)", value: "digitalisierung" }
                  - { label: "Beratung (Dokument)", value: "beratung" }
                  - { label: "Sonstiges (Stern)", value: "sonstiges" }
              - { label: "Preis-Hinweis auf der Karte (optional)", name: "badge", widget: "string", required: false, hint: "Z. B. \"75 € / Stunde\" oder \"ab 50 €\" – leer lassen für keinen Hinweis. Unabhängig von der Preisübersicht weiter unten, dort ggf. auch anpassen." }

  - name: "blog"
    label: "Blog"
    label_singular: "Blogbeitrag"
    files:
      - file: "data/blog.json"
        label: "Blogbeiträge"
        name: "blog"
        fields:
          - { label: "Überschrift-Kürzel", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - label: "Beiträge"
            name: "posts"
            widget: "list"
            label_singular: "Beitrag"
            summary: "{{title}} ({{date}})"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Datum", name: "date", widget: "date", date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { label: "Bild", name: "image", widget: "image", required: false, hint: "Optional – wird oben im Beitrag angezeigt." }
              - { label: "Text", name: "text", widget: "text" }

  - name: "events"
    label: "Termine"
    label_singular: "Termin"
    files:
      - file: "data/events.json"
        label: "Termine"
        name: "events"
        fields:
          - { label: "Überschrift-Kürzel", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - label: "Termine"
            name: "events"
            widget: "list"
            label_singular: "Termin"
            summary: "{{title}} ({{date}})"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Datum", name: "date", widget: "date", date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { label: "Ort", name: "location", widget: "string", required: false }
              - { label: "Beschreibung", name: "description", widget: "text" }

  - name: "pages"
    label: "Seiteninhalte"
    label_singular: "Seite"
    files:
      - file: "data/home.json"
        label: "Startseite"
        name: "home"
        fields:
          - { label: "Hauptüberschrift (unter dem Logo)", name: "heroTagline", widget: "string" }
          - { label: "Begrüßungstext", name: "heroText", widget: "text" }
          - { label: "Einleitungstext \"Das biete ich an\"", name: "servicesIntro", widget: "text" }
          - { label: "Überschrift \"Über mich\"-Vorschau", name: "aboutHeading", widget: "string" }
          - { label: "Text \"Über mich\"-Vorschau", name: "aboutText", widget: "text" }
          - { label: "Überschrift Angebots-Box (unten)", name: "contactHeading", widget: "string" }
          - { label: "Text Angebots-Box (unten)", name: "contactText", widget: "text" }

      - file: "data/ueber-mich.json"
        label: "Über mich"
        name: "ueber-mich"
        fields:
          - { label: "Überschrift-Kürzel", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Text", name: "text", widget: "text", hint: "Für einen Absatz-Umbruch eine leere Zeile zwischen zwei Absätzen lassen." }

      - file: "data/kontakt-seite.json"
        label: "Kontakt-Seite (Überschrift-Text)"
        name: "kontakt-seite"
        fields:
          - { label: "Überschrift-Kürzel", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Text auf dem E-Mail-Knopf", name: "emailButtonText", widget: "string" }

      - file: "data/impressum.json"
        label: "Impressum"
        name: "impressum"
        fields:
          - { label: "Einleitungszeile (unter der Überschrift)", name: "intro", widget: "string" }
          - label: "Inhalt"
            name: "content"
            widget: "markdown"
            hint: "Rechtlicher Inhalt des Impressums. Bitte vorsichtig bearbeiten – im Zweifel vorher mit Claude oder einem Anwalt/Steuerberater absprechen. Hier kann z. B. auch eine Umsatzsteuer-ID ergänzt werden, falls vorhanden."
            buttons: ["bold", "italic", "link", "heading-two", "quote", "bulleted-list", "numbered-list"]

      - file: "data/datenschutz.json"
        label: "Datenschutz"
        name: "datenschutz"
        fields:
          - label: "Inhalt"
            name: "content"
            widget: "markdown"
            hint: "Rechtlicher Inhalt der Datenschutzerklärung. Bitte vorsichtig bearbeiten – im Zweifel vorher mit Claude oder einem Anwalt/Datenschutzexperten absprechen."
            buttons: ["bold", "italic", "link", "heading-two", "quote", "bulleted-list", "numbered-list"]
