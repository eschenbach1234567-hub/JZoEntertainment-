<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JZo Video AI</title>
<meta name="description" content="Videoschnitt mit Farbkorrektur, Effekten und KI – JZo Entertainment Video AI.">
<meta name="robots" content="noindex">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JZo Video AI">
<meta name="theme-color" content="#f6f5f2">
<link rel="stylesheet" href="css/video.css">
</head>
<body data-page="edit">

<header class="top">
  <img src="../assets/img/logo-transparent.png" alt="JZo Entertainment" class="logo">
  <div class="brand"><b>Video AI</b><span id="pj-title">Projekt</span></div>
  <button class="icon-btn" id="undo-btn" type="button" aria-label="Rückgängig" title="Rückgängig (⌘Z)" disabled>↶</button>
  <button class="icon-btn" id="redo-btn" type="button" aria-label="Wiederholen" title="Wiederholen (⇧⌘Z)" disabled>↷</button>
  <button class="ai-btn" id="ai-btn" type="button">✨ KI</button>
</header>

<div class="work">
  <div class="editor">
    <div class="stage"><canvas id="view" width="960" height="540"></canvas></div>
    <div class="transport">
      <span class="time" id="time">00:00.00</span>
      <div class="tp-mid">
        <button class="icon-btn" id="start-btn" type="button" aria-label="Zum Anfang">⏮</button>
        <button class="play" id="play-btn" type="button" aria-label="Abspielen"><span class="i-play">▶</span><span class="i-pause">❚❚</span></button>
        <button class="icon-btn" id="end-btn" type="button" aria-label="Zum Ende">⏭</button>
      </div>
      <div class="tp-right">
        <button class="icon-btn" id="split-btn" type="button" aria-label="Teilen am Abspielkopf" title="Teilen (B)">✂️</button>
        <button class="icon-btn" id="del-btn" type="button" aria-label="Markiertes löschen" title="Löschen">🗑</button>
        <button class="icon-btn sm" id="zout-btn" type="button" aria-label="Timeline verkleinern">－</button>
        <button class="icon-btn sm" id="zin-btn" type="button" aria-label="Timeline vergrößern">＋</button>
      </div>
    </div>
    <div class="tl-wrap">
      <div class="timeline" id="tl"><div class="tl-inner" id="tl-inner"></div></div>
      <div class="playhead"></div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<nav class="tabbar">
  <button type="button" data-page="media"><i>📁</i>Medien</button>
  <button type="button" data-page="edit"><i>✂️</i>Schnitt</button>
  <button type="button" data-page="color"><i>🎨</i>Farbe</button>
  <button type="button" data-page="fx"><i>⚡</i>Effekte</button>
  <button type="button" data-page="ai"><i>✨</i>KI</button>
  <button type="button" data-page="export"><i>📤</i>Export</button>
</nav>

<div class="exp-overlay hidden" id="exp-overlay">
  <div class="exp-box">
    <b>🎬 Video wird erstellt …</b>
    <p>Bitte Bildschirm anlassen und die App nicht verlassen.</p>
    <div class="bar"><div id="exp-bar"></div></div>
    <button class="btn" id="exp-cancel" type="button">Abbrechen</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="media-pool" aria-hidden="true"></div>

<script src="js/library.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
